name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  j-wash:
    name: J-Wash (${{ matrix.os }}, py${{ matrix.python }}, transformers-${{ matrix.transformers }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            transformers: "5.5.0"
          - os: ubuntu-latest
            python: "3.11"
            transformers: "5.14.1"
          - os: ubuntu-latest
            python: "3.12"
            transformers: "5.5.0"
          - os: ubuntu-latest
            python: "3.12"
            transformers: "5.14.1"
          - os: windows-latest
            python: "3.12"
            transformers: "5.14.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt "transformers==${{ matrix.transformers }}" "accelerate==1.14.0"
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Show test environment
        run: |
          python -m pytest --version
          python -c "import torch, transformers, accelerate; print(torch.__version__, transformers.__version__, accelerate.__version__)"
      - name: Install pinned Jacobian Lens
        run: python scripts/bootstrap_jlens.py
      - name: Run J-Wash tests
        run: python -m pytest -q tests/
      - name: Compile Python sources
        run: python -m compileall -q api core scripts tests
      - name: Check patch whitespace
        run: git diff --check

  jacobian-lens:
    name: Jacobian Lens (${{ matrix.os }}, py${{ matrix.python }}, transformers-${{ matrix.transformers }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            transformers: "5.5.0"
          - os: ubuntu-latest
            python: "3.11"
            transformers: "5.14.1"
          - os: ubuntu-latest
            python: "3.12"
            transformers: "5.5.0"
          - os: ubuntu-latest
            python: "3.12"
            transformers: "5.14.1"
          - os: windows-latest
            python: "3.12"
            transformers: "5.14.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependency versions under test
        run: python -m pip install -r requirements.txt "transformers==${{ matrix.transformers }}" "accelerate==1.14.0"
      - name: Install test tooling
        run: python -m pip install pytest
      - name: Show test environment
        run: |
          python -m pytest --version
          python -c "import torch, transformers, accelerate; print(torch.__version__, transformers.__version__, accelerate.__version__)"
      - name: Install pinned Jacobian Lens
        run: python scripts/bootstrap_jlens.py
      - name: Run pinned Jacobian Lens tests
        run: python -m pytest -q vendor/jacobian-lens/tests/
